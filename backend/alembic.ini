[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Keep this file ASCII-only: Alembic reads it with the OS locale encoding (GBK on Chinese Windows).
# The database URL comes from app settings (env vars / .env), see migrations/env.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
